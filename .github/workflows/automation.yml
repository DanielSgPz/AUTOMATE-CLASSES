name: Automate Classes

on:
  schedule:
    # 11:00 UTC equivale a 06:00 en Colombia (UTC-5).
    # Se ejecuta solo los días previos a clase:
    # Domingo->Lunes, Lunes->Martes, Miércoles->Jueves, Jueves->Viernes.
    - cron: "0 11 * * 0,1,3,4"
  workflow_dispatch:

concurrency:
  group: automate-classes
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Bogota
      SMART_LOGIN_URL: https://schoolpack.smart.edu.co/idiomas/alumnos.aspx
      PLAYWRIGHT_HEADLESS: "true"
      SMART_USERNAME: ${{ secrets.SMART_USERNAME }}
      SMART_PASSWORD: ${{ secrets.SMART_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run automation
        run: python main.py

      - name: Upload screenshots artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore