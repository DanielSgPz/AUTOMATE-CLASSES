name: Automate Classes

on:
  schedule:
    # 11:05 UTC equivale a 06:05 en Colombia (UTC-5).
    - cron: "5 11 * * *"
  workflow_dispatch:

concurrency:
  group: automate-classes
  cancel-in-progress: false

jobs:
  run-automation:
    # Playwright 1.59 no soporta todavía el runner ubuntu-26.04 al que
    # puede apuntar ubuntu-latest. Fijamos una imagen compatible y estable.
    runs-on: ubuntu-24.04
    # Permite hasta tres intentos técnicos separados por diez minutos.
    timeout-minutes: 90
    env:
      TZ: America/Bogota
      SMART_LOGIN_URL: https://schoolpack.smart.edu.co/idiomas/alumnos.aspx
      PLAYWRIGHT_HEADLESS: "true"
      SMART_USERNAME: ${{ secrets.SMART_USERNAME }}
      SMART_PASSWORD: ${{ secrets.SMART_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PROGRAMMING_PROFILE_JSON: ${{ vars.PROGRAMMING_PROFILE_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Run automation
        run: python main.py --scheduled

      - name: Upload screenshots artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
